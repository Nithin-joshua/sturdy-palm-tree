# Render Blueprint specification for 1-click cloud deployment
# See docs/hosting.md for step-by-step instructions.
services:
  - type: web
    name: industrial-inspection-agent
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INSPECTION_DETECTOR
        value: vlm
      - key: INSPECTION_VLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: INSPECTION_VLM_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: INSPECTION_VLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
